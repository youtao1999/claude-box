# Claude Code for the flake pipeline. Folder paths are in .env.
#   docker compose build
#   docker compose up -d                            (start; it keeps running)
#   docker exec -it flake-claude claude             (Claude; log in the first time)
#   docker exec -it flake-claude bash               (a shell in the same container)
# Never add here: /var/run/docker.sock, a whole drive, the home folder, ~/.ssh.
services:
  claude:
    build:
      context: .
      additional_contexts:
        repo: ${REPO_DIR}
        klayoutclaw: ${REPO_DIR}/KlayoutClaw    # submodule (youtao1999/KlayoutClaw, branch lab)
    image: flake-claude
    container_name: flake-claude
    hostname: flake-claude
    restart: unless-stopped         # long-running: the no-mistakes daemon watches PRs between sessions
    init: true
    cap_add: [NET_ADMIN, NET_RAW]   # for init-firewall.sh only; Claude runs as the non-root user dev
    environment:
      FLAKE_PICTURES: /data/raw
      FLAKE_RAW_TOP: /data/raw
      FLAKE_RESULTS: /data/derived
      FLAKE_DEVICES: /data/derived/devices    # device folders: visible on the PC, outside the repo
      PYTHON_PATH: /usr/bin/python3            # KlayoutKlaw auto_route / evaluate_design workers (no conda)
      # workbook links as the PC sees these folders, so they open in Excel; the *_LINK variables
      # are needed only when the *_DIR paths are not the PC's own (Docker inside WSL: /mnt/d/...)
      FLAKE_LINK_MAP: /data/raw=${RAW_LINK:-${RAW_DIR}};/data/derived=${DERIVED_LINK:-${DERIVED_DIR}};/workspace=${REPO_LINK:-${REPO_DIR}}
      GIT_AUTHOR_NAME: ${GIT_NAME}
      GIT_AUTHOR_EMAIL: ${GIT_EMAIL}
      GIT_COMMITTER_NAME: ${GIT_NAME}
      GIT_COMMITTER_EMAIL: ${GIT_EMAIL}
    volumes:
      - ${REPO_DIR}:/workspace                 # code Claude edits
      - ${RAW_DIR}:/data/raw:ro                # pictures: read-only
      - ${DERIVED_DIR}:/data/derived           # detection results, tray calibrations
      - ${SCRATCH_DIR}:/data/scratch           # temporary work
      - ${KLAYOUT_WORK_DIR}:/data/klayout      # KLayout / KlayoutKlaw files
      - claude_cfg:/home/dev/.claude           # Claude login and settings
      - gh_cfg:/home/dev/.config/gh            # GitHub login
      - nm_state:/home/dev/.no-mistakes        # no-mistakes gate state
      - gnhf_cfg:/home/dev/.gnhf

volumes:
  claude_cfg:
  gh_cfg:
  nm_state:
  gnhf_cfg:
